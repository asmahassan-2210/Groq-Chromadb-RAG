<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Assistant</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 600px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 80vh;
        }

        .chat-header {
            background: #2563eb;
            color: #ffffff;
            padding: 16px 20px;
            font-size: 1.2rem;
            font-weight: 600;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 10px;
            line-height: 1.5;
            font-size: 0.95rem;
        }

        .message.user {
            align-self: flex-end;
            background-color: #2563eb;
            color: #ffffff;
            border-bottom-right-radius: 2px;
        }

        .message.bot {
            align-self: flex-start;
            background-color: #e5e7eb;
            color: #1f2937;
            border-bottom-left-radius: 2px;
        }

        .message .sources {
            margin-top: 8px;
            font-size: 0.8rem;
            color: #4b5563;
            border-top: 1px solid #d1d5db;
            padding-top: 4px;
        }

        .chat-input-area {
            display: flex;
            padding: 15px;
            border-top: 1px solid #e5e7eb;
            background: #fafafa;
            gap: 10px;
        }

        .chat-input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            outline: none;
            font-size: 0.95rem;
        }

        .chat-input-area input:focus {
            border-color: #2563eb;
        }

        .chat-input-area button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .chat-input-area button:hover {
            background-color: #1d4ed8;
        }

        .loading-dots {
            display: inline-block;
        }

        .loading-dots::after {
            content: ' .';
            animation: dots 1s steps(5, start) infinite;
        }

        @keyframes dots {
            0%, 20% { content: ' .'; }
            40% { content: ' ..'; }
            60% { content: ' ...'; }
            80%, 100% { content: ''; }
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        Groq + ChromaDB RAG Assistant
    </div>
    
    <div class="chat-messages" id="chatMessages">
        <div class="message bot">
            Hello! Ask me any question based on your ingested documents.
        </div>
    </div>

    <div class="chat-input-area">
        <input type="text" id="userInput" placeholder="Ask a question..." onkeydown="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    const API_URL = "http://127.0.0.1:8000/rag/query";

    async function sendMessage() {
        const inputField = document.getElementById("userInput");
        const chatMessages = document.getElementById("chatMessages");
        const question = inputField.value.trim();

        if (!question) return;

        // Append User Message
        appendMessage(question, "user");
        inputField.value = "";

        // Append Loading Indicator
        const loadingDiv = document.createElement("div");
        loadingDiv.className = "message bot";
        loadingDiv.innerHTML = 'Thinking<span class="loading-dots"></span>';
        chatMessages.appendChild(loadingDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;

        try {
            const response = await fetch(API_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Accept": "application/json"
                },
                body: JSON.stringify({
                    question: question,
                    top_k: 5,
                    source: null
                })
            });

            const data = await response.json();
            chatMessages.removeChild(loadingDiv);

            if (response.ok) {
                let botText = data.answer || "No response generated.";
                let sourcesText = "";
                
                if (data.sources && data.sources.length > 0) {
                    sourcesText = `<div class="sources"><strong>Sources:</strong> ${data.sources.join(", ")}</div>`;
                }

                appendMessage(botText + sourcesText, "bot", true);
            } else {
                appendMessage("Error: Could not retrieve a valid answer from the server.", "bot");
            }

        } catch (error) {
            chatMessages.removeChild(loadingDiv);
            appendMessage("Error: Unable to connect to backend server. Make sure Uvicorn is running.", "bot");
            console.error("API Fetch Error:", error);
        }
    }

    function appendMessage(content, sender, isHTML = false) {
        const chatMessages = document.getElementById("chatMessages");
        const messageDiv = document.createElement("div");
        messageDiv.className = `message ${sender}`;
        
        if (isHTML) {
            messageDiv.innerHTML = content;
        } else {
            messageDiv.textContent = content;
        }

        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }
</script>

</body>
</html>
